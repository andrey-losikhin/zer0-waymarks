id = "zer0/waymarks"
name = "Waymarks"
version = "0.1.0"
plugin_api = 24
author = "zer0"
license = "Apache-2.0"
dependencies = ["zer0-waymarks-helper"]
tags = ["bookmarks", "launcher", "productivity"]
icon = "bookmark"
description = "Search and add bookmarks from a local browser-independent collection."

[[launcher_provider]]
id = "search"
entry = "launcher.luau"
prefix = "wm"
glyph = "bookmark"
include_in_global_search = false
debounce_ms = 100

[[panel]]
id = "panel"
entry = "panel.luau"
width = 560
height = 720
placement = "floating"
position = "center"
keyboard_focus = "exclusive"
capture_keys = [
  "Up", "Down", "Left", "Right", "Return", "Enter", "Escape",
  "Ctrl+1", "Ctrl+2", "Ctrl+3", "Ctrl+N", "Ctrl+F", "Ctrl+O",
  "Ctrl+T", "Ctrl+Shift+T", "Ctrl+Up", "Ctrl+Down", "Ctrl+Return", "Ctrl+Enter",
]
